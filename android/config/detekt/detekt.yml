# Layered on top of Detekt's default config (buildUponDefaultConfig = true).
style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  MaxLineLength:
    maxLineLength: 120
  ForbiddenImport:
    active: true
    excludes: ['**/core/map-maplibre/**']
    forbiddenImports:
      - value: 'org.maplibre.*'
        reason: 'Map provider APIs are only allowed in :core:map-maplibre (see CLAUDE.md).'
complexity:
  TooManyFunctions:
    # ViewModels expose one public function per UI event; count only those.
    ignorePrivate: true
  LongParameterList:
    allowedFunctionParameters: 8
    ignoreDefaultParameters: true
    ignoreAnnotatedParameter:
      - 'Composable'
naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
    functionPattern: '[a-z][a-zA-Z0-9]*|[a-z][a-zA-Z0-9_]*'
Compose:
  ComposableAnnotationNaming:
    active: true
  CompositionLocalAllowlist:
    active: true
    # LocalMapProvider is the single wiring point for the map implementation (docs/adr/0002).
    # LocalTreesColors carries theme colours Material has no slot for, like MaterialTheme's own locals.
    allowedCompositionLocals:
      - LocalMapProvider
      - LocalTreesColors

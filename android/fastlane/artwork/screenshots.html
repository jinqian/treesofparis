<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:N;src:url(../../../website/fonts/newsreader.woff2)}@font-face{font-family:I;src:url(../../../website/fonts/inter.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:#F4F3EC;color:#1E2620;font-family:I,system-ui,sans-serif}
body.nuit{background:#141815;color:#E6E8E1}
.cap{position:absolute;top:118px;left:80px;right:80px;text-align:center}
h1{font-family:N,Georgia,serif;font-weight:500;font-size:78px;line-height:1.04;letter-spacing:-1px;margin:0;text-wrap:balance}
p{font-size:36px;line-height:1.3;margin:20px 0 0;color:#5C665D}
.nuit p{color:#A3AB9F}
.phone{position:absolute;left:190px;top:372px;width:672px;padding:14px;border-radius:70px;background:#1E2620;
  box-shadow:0 30px 60px rgba(30,38,32,.22),0 4px 12px rgba(30,38,32,.12)}
.nuit .phone{background:#2A302B;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.phone img{display:block;width:672px;border-radius:56px}
</style></head><body>
<div class="cap"><h1 id="t"></h1><p id="s"></p></div>
<div class="phone"><img id="i" alt=""></div>
<script>
// One Play Store screenshot per ?n= (1–6), 1080 × 1920. Captures in screens/: debug build on an emulator, demo-mode
// status bar. See README.md for rendering.
const shots = [
  ['carte', 'Les arbres de Paris', 'Un par un sur une carte, les remarquables en or'],
  ['fiche', 'Chaque arbre a sa fiche', 'Nom, taille, floraison et Wikipédia'],
  ['herbier', 'L’herbier de Paris', 'Les arbres de la ville en chiffres'],
  ['essences', '21 essences dessinées', 'Platane, marronnier, tilleul… et leur part dans Paris'],
  ['favoris', 'Vos arbres préférés', 'Gardez-les en favoris, sans créer de compte'],
  ['nuit-carte', 'Aussi la nuit', 'Un thème sombre pour les promenades du soir'],
];
const [file, title, sub] = shots[(+new URLSearchParams(location.search).get('n') || 1) - 1];
if (file.startsWith('nuit')) document.body.className = 'nuit';
document.getElementById('t').textContent = title;
document.getElementById('s').textContent = sub;
document.getElementById('i').src = 'screens/' + file + '.jpg';
</script></body></html>

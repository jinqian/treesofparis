name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A pull request that only touches the website, docs/ or Markdown files skips the Android job. The job is still
  # reported (as skipped), which counts as passing for the required check. Pushes to main always run it.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(git diff --name-only "$BASE...$HEAD" | grep -vE '^(website|docs)/|\.md$' || true)
          if [ -n "$others" ]; then
            echo "Android job runs for:"
            echo "$others"
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only website, docs or Markdown changed: the Android job is skipped."
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android (static analysis, unit tests, build)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the Gradle cache; pull requests reuse it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Static analysis
        run: ./gradlew spotlessCheck detekt checkModuleBoundaries

      # Also compares every screenshot test with its reference image (src/test/screenshots/ in each feature):
      # a visual change fails here until the references are recorded again (./gradlew recordRoborazziDebug).
      - name: Unit and screenshot tests
        run: ./gradlew testDebugUnitTest -Proborazzi.test.verify=true

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Unsigned: catches missing R8 rules, which only show up in a minified build.
      - name: Build release APK (R8)
        run: ./gradlew assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
            android/**/build/outputs/roborazzi/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  data:
    name: Data script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements-dev.txt
      - run: pip install -r data/requirements-dev.txt
      - run: python -I -m pytest data/tests

  commit-msg:
    name: Commit message check tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/commit-msg-check_test.sh

  # The two dependency jobs need GitHub's dependency graph, which is off for private repositories, and dependency
  # review also needs GitHub Advanced Security there. They only run while the repository is public.
  dependency-submission:
    name: Submit Gradle dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: android

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

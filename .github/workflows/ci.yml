name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which jobs a pull request needs, from the files it changes. Markdown files never run anything: a PR that only
  # changes .md files skips every job below. Otherwise the Android job runs only for a change under android/ (or to
  # this workflow); a PR that only touches the Android app skips the data (and web map) tests, unless it changes
  # :core:data (Room schema, trees.db) or :core:domain (rules the scripts copy), which they read. A skipped job is
  # still reported, and counts as passing for its required check. Pushes to main and manual runs run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
      data: ${{ steps.diff.outputs.data }}
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            { echo "android=true"; echo "data=true"; echo "code=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          git diff --name-only "$BASE...$HEAD"
          # Everything but Markdown.
          changed=$(git diff --name-only "$BASE...$HEAD" | grep -vE '\.md$' || true)
          android=false
          data=false
          code=false
          if [ -n "$changed" ]; then
            code=true
            # Android: a change under android/ (a data change the app sees, trees.db, its version or the Room schema,
            # is there too), or to this workflow, so that a change to these rules is checked by every job.
            if echo "$changed" | grep -qE '^android/|^\.github/workflows/ci\.yml$'; then android=true; fi
            # Data: anything outside android/, or in the modules the data scripts read.
            if echo "$changed" | grep -qvE '^android/' || echo "$changed" | grep -qE '^android/core/(data|domain)/'; then
              data=true
            fi
          fi
          { echo "android=$android"; echo "data=$data"; echo "code=$code"; } >> "$GITHUB_OUTPUT"
          echo "Android job: $android · data job: $data · other jobs: $code"

  android:
    name: Android (static analysis, unit tests, build)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the Gradle cache; pull requests reuse it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Static analysis
        run: ./gradlew spotlessCheck detekt checkModuleBoundaries

      # Also compares every screenshot test with its reference image (src/test/screenshots/ in each feature):
      # a visual change fails here until the references are recorded again (./gradlew recordRoborazziDebug).
      - name: Unit and screenshot tests
        run: ./gradlew testDebugUnitTest -Proborazzi.test.verify=true

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Unsigned: catches missing R8 rules, which only show up in a minified build.
      - name: Build release APK (R8)
        run: ./gradlew assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
            android/**/build/outputs/roborazzi/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  data:
    name: Data script tests
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements-dev.txt
      - run: pip install -r data/requirements-dev.txt
      - run: python -I -m pytest data/tests

  commit-msg:
    name: Commit message check tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/commit-msg-check_test.sh

  # The two dependency jobs need GitHub's dependency graph, which is off for private repositories, and dependency
  # review also needs GitHub Advanced Security there. They only run while the repository is public.
  dependency-submission:
    name: Submit Gradle dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: android

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && !github.event.repository.private && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

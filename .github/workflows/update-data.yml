name: Update tree data

on:
  schedule:
    - cron: "0 5 1 * *" # monthly, 1st at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download and rebuild trees.db
        id: build
        run: |
          python -I data/scripts/update_trees.py | tee report.txt
          {
            echo 'report<<EOF'
            cat report.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Exports the Room schema for a bumped data version and opens the new asset through Room.
      - name: Verify the asset with Room
        run: ./gradlew :core:data:testDebugUnitTest

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-tree-data
          commit-message: "chore(data): update packaged tree database"
          title: "chore(data): update packaged tree database"
          body: |
            Monthly refresh of the Paris Open Data « Les arbres » dataset.

            ```
            ${{ steps.build.outputs.report }}
            ```

            Generated by `.github/workflows/update-data.yml`.
          add-paths: |
            core/data/src/main/assets/trees.db
            core/data/trees-db-version.txt
            core/data/trees-db-content.sha256
            core/data/schemas/**
          delete-branch: true
